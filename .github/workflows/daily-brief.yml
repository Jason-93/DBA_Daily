name: daily-brief

on:
  schedule:
    # 主: 每天 04:41 Asia/Shanghai = 20:41 UTC 前一日(避开 UTC 0-6 点全球 cron 高峰, 延迟数小时也能在上午出刊)
    - cron: "41 20 * * *"
    # 兜底: 每天 07:13 Asia/Shanghai = 23:13 UTC 前一日(幂等保证重复触发安全)
    - cron: "13 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "日期 YYYY-MM-DD（默认今天，Asia/Shanghai）"
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests pyyaml beautifulsoup4

      - name: Generate brief (idempotent)
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          ARGS="--mode daily"
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          python cloud/gen.py $ARGS

      - name: Detect generated or existing page
        id: detect
        run: |
          SLUG="${{ inputs.date }}"
          if [ -z "$SLUG" ]; then SLUG=$(TZ=Asia/Shanghai date +%F); fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          GEN=""
          if [ -f .generated ]; then GEN=$(cat .generated); fi
          # 已生成但未部署成功时，兜底场也要继续发布现有成品。
          if [ "$GEN" = "$SLUG" ] || { [ -f "briefs/$SLUG.md" ] && [ -f "$SLUG.html" ]; }; then
            WD=$(TZ=Asia/Shanghai date -d "$SLUG" +%u)
            NAMES=(周一 周二 周三 周四 周五 周六 周日)
            echo "weekday=${NAMES[$((WD-1))]}" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            if [ "$GEN" = "$SLUG" ]; then
              echo "generated=true" >> "$GITHUB_OUTPUT"
            else
              echo "generated=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update site index & sitemap
        if: steps.detect.outputs.generated == 'true'
        run: |
          python cloud/site_update.py --mode daily \
            --slug "${{ steps.detect.outputs.slug }}" \
            --label "$(echo ${{ steps.detect.outputs.slug }} | cut -d- -f2-3)" \
            --title "晨报 · ${{ steps.detect.outputs.slug }}（${{ steps.detect.outputs.weekday }}）"

      - name: Commit & push
        if: steps.detect.outputs.found == 'true'
        run: |
          git config user.name "Jason-93"
          git config user.email "jason-93@users.noreply.github.com"
          git add -A
          # 兜底发布已有成品时没有新改动，不能把空提交视为失败。
          if ! git diff --cached --quiet; then
            git commit -m "brief: ${{ steps.detect.outputs.slug }} (cloud)"
            git push
          fi

      - name: Deploy through Pages workflow
        if: steps.detect.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 新生成与已有成品都走独立部署流程，避免内置部署失败后无法自愈。
        run: gh workflow run pages.yml
