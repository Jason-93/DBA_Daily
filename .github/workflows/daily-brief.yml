name: daily-brief

on:
  schedule:
    # 主: 每天 08:25 Asia/Shanghai = 00:25 UTC
    - cron: "25 0 * * *"
    # 兜底: 每天 11:25 Asia/Shanghai = 03:25 UTC(GitHub 高峰期限流时主时段可能延迟数小时,幂等保证重复触发安全)
    - cron: "25 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "日期 YYYY-MM-DD（默认今天，Asia/Shanghai）"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.detect.outputs.found }}
      slug: ${{ steps.detect.outputs.slug }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests pyyaml beautifulsoup4

      - name: Generate brief (idempotent)
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          ARGS="--mode daily"
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          python cloud/gen.py $ARGS

      - name: Detect generated page
        id: detect
        run: |
          SLUG="${{ inputs.date }}"
          if [ -z "$SLUG" ]; then SLUG=$(TZ=Asia/Shanghai date +%F); fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          GEN=""
          if [ -f .generated ]; then GEN=$(cat .generated); fi
          if [ "$GEN" = "$SLUG" ]; then
            WD=$(TZ=Asia/Shanghai date -d "$SLUG" +%u)
            NAMES=(周一 周二 周三 周四 周五 周六 周日)
            echo "weekday=${NAMES[$((WD-1))]}" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update site index & sitemap
        if: steps.detect.outputs.found == 'true'
        run: |
          python cloud/site_update.py --mode daily \
            --slug "${{ steps.detect.outputs.slug }}" \
            --label "$(echo ${{ steps.detect.outputs.slug }} | cut -d- -f2-3)" \
            --title "晨报 · ${{ steps.detect.outputs.slug }}（${{ steps.detect.outputs.weekday }}）"

      - name: Commit & push
        id: push
        if: steps.detect.outputs.found == 'true'
        run: |
          git config user.name "Jason-93"
          git config user.email "jason-93@users.noreply.github.com"
          git add -A
          git commit -m "brief: ${{ steps.detect.outputs.slug }} (cloud)"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: generate
    if: needs.generate.outputs.found == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify live page
        run: |
          sleep 90
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://jason-93.github.io/DBA_Daily/${{ needs.generate.outputs.slug }}.html")
          echo "live status: $CODE"
          test "$CODE" = "200"
